*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);

a{color:var(--accent);text-underline-offset:2px}

.head{max-width:72rem;margin:0 auto;width:100%;padding:18px 22px;

.brand{font:800 22px/1 var(--display);letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 22px}
.card{max-width:38rem;text-align:center}
.rule{font:700 11px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;

.code{font:800 clamp(72px,16vw,130px)/1 var(--display);color:var(--accent);
  letter-spacing:-.03em;margin:0 0 8px}
h1{font:700 clamp(22px,4vw,32px)/1.2 var(--display);letter-spacing:-.01em;margin:0 0 .5em}
p{color:var(--ink2);margin:0 0 1.8em;font-size:17px}
.links{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.links a{display:inline-block;padding:8px 14px;background:var(--paper);
  border:1px solid var(--rule);border-radius:3px;text-decoration:none;
  color:var(--ink2);font:600 13px/1 var(--mono);letter-spacing:.04em;
  transition:border-color .12s,color .12s}
.links a:hover{border-color:var(--accent);color:var(--accent);opacity:1}
.foot{max-width:72rem;margin:0 auto;width:100%;padding:28px 22px;
  border-top:1px solid var(--rule);color:var(--muted);font:400 13px/1.6 var(--sans)}
</style>
</head>
